<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nippon Snack - Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; background-color: #FEFBF6; }
    </style>
</head>
<body>
    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <span class="text-2xl font-bold" style="color: #E11D48;">Nippon Snack</span>
            </a>
            <nav class="hidden md:flex items-center space-x-8">
                <a href="index.html" class="text-gray-600 hover:text-rose-500 transition">Home</a>
                <a href="items.html" class="text-gray-600 hover:text-rose-500 transition">Items</a>
                <a href="about.html" class="text-gray-600 hover:text-rose-500 transition">About us</a>
                <a href="contact.html" class="text-gray-600 hover:text-rose-500 transition">Contact</a>
            </nav>
        </div>
    </header>
    <section class="container mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-bold text-gray-800">Contact</h2>
            <p class="text-gray-500">お問い合わせ</p>
        </div>
        <form class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="name">Name</label>
                <input class="w-full px-3 py-2 border rounded" type="text" id="name" name="name" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="email">Email</label>
                <input class="w-full px-3 py-2 border rounded" type="email" id="email" name="email" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2" for="message">Message</label>
                <textarea class="w-full px-3 py-2 border rounded" id="message" name="message" rows="5" required></textarea>
            </div>
            <button class="bg-rose-500 text-white py-2 px-6 rounded hover:bg-rose-600 font-bold" type="submit">Send</button>
        </form>
    </section>
</body>
</html>
